# Campus Buddy - Professor's Handover Compose File (Single-File Edition)
# Command: docker-compose -f docker-compose.prof.yml up -d

services:
  # Unified Database
  postgres:
    image: postgres:16-alpine
    container_name: campus-buddy-postgres
    environment:
      POSTGRES_DB: campus_buddy_auth
      POSTGRES_USER: parth
      POSTGRES_PASSWORD: password
    networks:
      - campus-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U parth" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-time DB Setup (Creates additional databases)
  db-init:
    image: postgres:16-alpine
    container_name: campus-buddy-db-init
    environment:
      PGPASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campus-network
    command: >
      sh -c "
      psql -h postgres -U parth -d campus_buddy_auth -c 'CREATE DATABASE campus_buddy_academic;' || true;
      psql -h postgres -U parth -d campus_buddy_auth -c 'CREATE DATABASE campus_buddy_campus;' || true;
      echo 'Databases initialized successfully.'
      "

  # Backend Services (Pulling from GHCR)
  auth-service:
    image: ghcr.io/parthbatra21/campus-buddy-auth-service:latest
    container_name: campus-buddy-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campus_buddy_auth
      SPRING_DATASOURCE_USERNAME: parth
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: campus-buddy-super-secret-key-change-this-in-production-with-minimum-256-bits-for-security
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

  academic-service:
    image: ghcr.io/parthbatra21/campus-buddy-academic-service:latest
    container_name: campus-buddy-academic-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campus_buddy_academic
      SPRING_DATASOURCE_USERNAME: parth
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: campus-buddy-super-secret-key-change-this-in-production-with-minimum-256-bits-for-security
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

  campus-service:
    image: ghcr.io/parthbatra21/campus-buddy-campus-service:latest
    container_name: campus-buddy-campus-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campus_buddy_campus
      SPRING_DATASOURCE_USERNAME: parth
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: campus-buddy-super-secret-key-change-this-in-production-with-minimum-256-bits-for-security
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

  bff-service:
    image: ghcr.io/parthbatra21/campus-buddy-bff-service:latest
    container_name: campus-buddy-bff-service
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: campus-buddy-super-secret-key-change-this-in-production-with-minimum-256-bits-for-security
      SERVICES_AUTH_URL: http://auth-service:8081
      SERVICES_ACADEMIC_URL: http://academic-service:8082
      SERVICES_CAMPUS_URL: http://campus-service:8083
    depends_on:
      - auth-service
      - academic-service
      - campus-service
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always

  # Frontend
  frontend:
    image: ghcr.io/parthbatra21/campus-buddy-frontend:latest
    container_name: campus-buddy-frontend
    ports:
      - "80:80"
    depends_on:
      - bff-service
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 128M
    restart: always

networks:
  campus-network:
    driver: bridge

volumes:
  postgres_data:
