services:
  # Unitied Database
  postgres:
    image: postgres:16-alpine
    container_name: campus-buddy-postgres
    environment:
      POSTGRES_DB: campus_buddy_auth # Primary DB
      POSTGRES_USER: parth
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_ready -U parth" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Services
  auth-service:
    build: ./backend/auth-service
    container_name: campus-buddy-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campus_buddy_auth
      SPRING_DATASOURCE_USERNAME: parth
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: campus-buddy-super-secret-key-change-this-in-production-with-minimum-256-bits-for-security
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 512M

  academic-service:
    build: ./backend/academic-service
    container_name: campus-buddy-academic-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campus_buddy_academic
      SPRING_DATASOURCE_USERNAME: parth
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: campus-buddy-super-secret-key-change-this-in-production-with-minimum-256-bits-for-security
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 512M

  campus-service:
    build: ./backend/campus-service
    container_name: campus-buddy-campus-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campus_buddy_campus
      SPRING_DATASOURCE_USERNAME: parth
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: campus-buddy-super-secret-key-change-this-in-production-with-minimum-256-bits-for-security
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 512M

  bff-service:
    build: ./backend/bff-service
    container_name: campus-buddy-bff-service
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: campus-buddy-super-secret-key-change-this-in-production-with-minimum-256-bits-for-security
      SERVICES_AUTH_URL: http://auth-service:8081
      SERVICES_ACADEMIC_URL: http://academic-service:8082
      SERVICES_CAMPUS_URL: http://campus-service:8083
    depends_on:
      - auth-service
      - academic-service
      - campus-service
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 256M

  # Frontend
  frontend:
    build: ./frontend/campus-buddy-ui
    container_name: campus-buddy-frontend
    ports:
      - "8088:80"
    depends_on:
      - bff-service
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  campus-network:
    driver: bridge

volumes:
  postgres_data:
