services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: campus-buddy-postgres
    environment:
      POSTGRES_DB: campus_buddy_auth
      POSTGRES_USER: parth
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U parth -d campus_buddy_auth" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Auth Service
  auth-service:
    build: ./backend/auth-service
    container_name: campus-buddy-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campus_buddy_auth
      DB_USERNAME: parth
      DB_PASSWORD: password
      JWT_SECRET: campus-buddy-super-secret-key-change-this-in-production-with-minimum-256-bits-for-security
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Academic Service (Attendance + Timetable)
  academic-service:
    build: ./backend/academic-service
    container_name: campus-buddy-academic-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campus_buddy_academic
      DB_USERNAME: parth
      DB_PASSWORD: password
      JWT_SECRET: campus-buddy-super-secret-key-change-this-in-production-with-minimum-256-bits-for-security
      ALLOW_DEBUG_LOCATION: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 512M

  # BFF Service (Copilot Brain)
  bff-service:
    build: ./backend/bff-service
    container_name: campus-buddy-bff-service
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: campus-buddy-super-secret-key-change-this-in-production-with-minimum-256-bits-for-security
      SERVICES_AUTH_URL: http://auth-service:8081
      SERVICES_ACADEMIC_URL: http://academic-service:8082
      SERVICES_NOTICES_URL: http://notice-service:8083
      SERVICES_BOOKINGS_URL: http://booking-service:8084
      SERVICES_RAG_PYTHON_URL: http://rag-service:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      VECTORSTORE_URL: jdbc:postgresql://postgres:5432/campus_buddy_vectors
      VECTORSTORE_USERNAME: parth
      VECTORSTORE_PASSWORD: password
    depends_on:
      - auth-service
      - academic-service
      - notice-service
      - booking-service
      - rag-service
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Notice Service
  notice-service:
    build: ./backend/notice-service
    container_name: campus-buddy-notice-service
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/campus_buddy_notices
      DATABASE_USERNAME: parth
      DATABASE_PASSWORD: password
      JWT_SECRET: campus-buddy-super-secret-key-change-this-in-production-with-minimum-256-bits-for-security
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 384M

  # Booking Service
  booking-service:
    build: ./backend/booking-service
    container_name: campus-buddy-booking-service
    ports:
      - "8084:8084"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/campus_buddy_bookings
      DATABASE_USERNAME: parth
      DATABASE_PASSWORD: password
      JWT_SECRET: campus-buddy-super-secret-key-change-this-in-production-with-minimum-256-bits-for-security
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 384M

  # Local RAG Service (Python)
  rag-service:
    build: ./model/ieee_vam
    container_name: campus-buddy-rag-service
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GEMINI_API_KEY}
      - PERSIST_DIRECTORY=db
    networks:
      - campus-network
    volumes:
      - ./model/ieee_vam/db:/app/db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # Frontend
  frontend:
    build: ./frontend/campus-buddy-ui
    container_name: campus-buddy-frontend
    ports:
      - "8088:80"
    depends_on:
      - bff-service
    networks:
      - campus-network
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  campus-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_models:
